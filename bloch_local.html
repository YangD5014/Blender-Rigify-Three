<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloch 球 · 本地</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f7fa; color: #222; font-family: -apple-system, sans-serif; }
  #viewport { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(255,255,255,0.9); border: 1px solid #ccc; border-radius: 8px; padding: 12px 14px; width: 260px; }
  h1 { font-size: 14px; color: #333; margin-bottom: 8px; }
  .quat { font-family: monospace; font-size: 12px; color: #333; line-height: 1.6; margin-top: 6px; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="panel">
  <h1>Bloch 球 · 四元数</h1>
  <div class="quat" id="quatText">q = (0,0,0,1)</div>
  <div class="quat" id="vecText">v = (0,0,1)</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2f7);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, 2, 3);
camera.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
document.getElementById('viewport').appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

// sphere wireframe
const wire = new THREE.Mesh(
  new THREE.SphereGeometry(1, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xc0392b, wireframe: true, transparent: true, opacity: 0.9 })
);
group.add(wire);

// solid translucent
const solid = new THREE.Mesh(
  new THREE.SphereGeometry(0.98, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0x3498db, transparent: true, opacity: 0.35 })
);
group.add(solid);

// axes
group.add(new THREE.AxesHelper(1.3));

// arrow
const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), 1, 0xe87d0d, 0.15, 0.10);
group.add(arrow);

// equator ring
const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.99, 1.0, 64),
  new THREE.MeshBasicMaterial({ color: 0x999999, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
);
ring.rotation.x = Math.PI/2;
group.add(ring);

renderer.setAnimationLoop(() => {
  group.rotation.y += 0.005;
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
