<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠影孪生-数字孪生体操作平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #232323; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; color: #d1d1d1; }
  #viewport { position: absolute; inset: 0; }
  #hud { position: absolute; top: 10px; right: 12px; z-index: 10; background: #2b2b2bcc; padding: 6px 10px; border-radius: 4px; font-size: 11px; color: #999; pointer-events: none; line-height: 1.6; }
  #hud b { color: #e87d0d; }
  #hintbar { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; background: #2b2b2bee; border-top: 1px solid #1a1a1a; padding: 5px 12px; font-size: 11px; color: #888; }
  #hintbar b { color: #ccc; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #232323; z-index: 100; font-size: 14px; color: #e87d0d; flex-direction: column; gap: 10px; }
  #loading .bar { width: 220px; height: 4px; background: #3a3a3a; border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; background: #e87d0d; border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  #axisgizmo { position: absolute; top: 10px; right: 10px; z-index: 10; width: 80px; height: 80px; pointer-events: none; }
  #axisgizmo canvas { width: 100%; height: 100%; display: block; }
  @media (orientation: portrait) { #rotateHint { display: flex !important; } }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="axisgizmo" style="position:absolute; top:10px; right:12px; z-index:11; width:80px; height:80px; pointer-events:none;"></div>
<div id="hud" style="top:110px;"></div>
<div id="hintbar">
  <b>选中控制器后按 G</b> 移动（跟随鼠标）· 按 <b>R</b> 旋转 · 移动中按 <b>X/Y/Z</b> 轴向锁定 ·
  <b>左键/Enter</b> 确认 · <b>Esc/右键</b> 取消 · <b>左键拖空处</b> 旋转视图 · <b>右键拖空处</b> 平移 · <b>滚轮</b> 缩放
</div>
<div id="loading"><div>加载猫咪绑定资源…</div><div class="bar"><i></i></div></div>
<div id="rotateHint" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#232323;color:#e87d0d;font-size:18px;z-index:200;">请将设备横屏以获得最佳体验</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three-ik": "./vendor/three-ik.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./js/main.js?v=1793520440"></script>
</body>
</html>
